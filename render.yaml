# Render deployment configuration — free tier, single web service
services:
  - type: web
    name: image-converter
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: MAX_CONTENT_LENGTH
        value: "52428800"
      - key: FILE_RETENTION_MINUTES
        value: "60"
